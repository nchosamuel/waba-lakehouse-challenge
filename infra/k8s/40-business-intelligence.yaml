{
  "apiVersion": "v1",
  "kind": "List",
  "items": [
    {
      "apiVersion": "v1",
      "kind": "PersistentVolumeClaim",
      "metadata": {
        "name": "superset-state",
        "namespace": "serving",
        "labels": {
          "app.kubernetes.io/part-of": "waba"
        }
      },
      "spec": {
        "accessModes": [
          "ReadWriteOnce"
        ],
        "resources": {
          "requests": {
            "storage": "1Gi"
          }
        }
      }
    },
    {
      "apiVersion": "apps/v1",
      "kind": "Deployment",
      "metadata": {
        "name": "superset",
        "namespace": "serving",
        "labels": {
          "app.kubernetes.io/part-of": "waba"
        }
      },
      "spec": {
        "replicas": 0,
        "strategy": {
          "type": "Recreate"
        },
        "selector": {
          "matchLabels": {
            "app": "superset"
          }
        },
        "template": {
          "metadata": {
            "labels": {
              "app.kubernetes.io/part-of": "waba",
              "app": "superset"
            }
          },
          "spec": {
            "containers": [
              {
                "name": "superset",
                "image": "waba/superset:20261014",
                "imagePullPolicy": "IfNotPresent",
                "ports": [
                  {
                    "containerPort": 8088
                  }
                ],
                "resources": {
                  "requests": {
                    "cpu": "100m",
                    "memory": "128Mi"
                  },
                  "limits": {
                    "memory": "1024Mi"
                  }
                },
                "env": [],
                "envFrom": [
                  {
                    "secretRef": {
                      "name": "waba-bi-runtime"
                    }
                  }
                ],
                "volumeMounts": [
                  {
                    "name": "state",
                    "mountPath": "/app/superset_home"
                  }
                ],
                "startupProbe": {
                  "httpGet": {
                    "path": "/health",
                    "port": 8088
                  },
                  "periodSeconds": 10,
                  "failureThreshold": 30
                },
                "readinessProbe": {
                  "httpGet": {
                    "path": "/health",
                    "port": 8088
                  },
                  "periodSeconds": 15,
                  "failureThreshold": 3
                },
                "livenessProbe": {
                  "httpGet": {
                    "path": "/health",
                    "port": 8088
                  },
                  "periodSeconds": 30,
                  "failureThreshold": 5
                }
              }
            ],
            "volumes": [
              {
                "name": "state",
                "persistentVolumeClaim": {
                  "claimName": "superset-state"
                }
              }
            ],
            "terminationGracePeriodSeconds": 45,
            "automountServiceAccountToken": false,
            "securityContext": {
              "fsGroup": 1000
            }
          }
        }
      }
    },
    {
      "apiVersion": "v1",
      "kind": "Service",
      "metadata": {
        "name": "superset",
        "namespace": "serving",
        "labels": {
          "app.kubernetes.io/part-of": "waba"
        }
      },
      "spec": {
        "selector": {
          "app": "superset"
        },
        "ports": [
          {
            "name": "p8088",
            "port": 8088,
            "targetPort": 8088
          }
        ]
      }
    }
  ]
}
