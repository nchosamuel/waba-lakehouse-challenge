{
  "apiVersion": "v1",
  "kind": "List",
  "items": [
    {
      "apiVersion": "batch/v1",
      "kind": "CronJob",
      "metadata": {
        "name": "metadata-discovery",
        "namespace": "governance"
      },
      "spec": {
        "schedule": "15 2 * * *",
        "timeZone": "Etc/UTC",
        "concurrencyPolicy": "Forbid",
        "successfulJobsHistoryLimit": 2,
        "failedJobsHistoryLimit": 2,
        "jobTemplate": {
          "spec": {
            "backoffLimit": 1,
            "activeDeadlineSeconds": 600,
            "template": {
              "metadata": {
                "labels": {
                  "app": "metadata-discovery"
                }
              },
              "spec": {
                "restartPolicy": "Never",
                "automountServiceAccountToken": false,
                "containers": [
                  {
                    "name": "metadata-discovery",
                    "image": "waba/metadata-ingestion:20261014",
                    "imagePullPolicy": "IfNotPresent",
                    "envFrom": [
                      {
                        "secretRef": {
                          "name": "waba-metadata-pipeline"
                        }
                      }
                    ],
                    "resources": {
                      "requests": {
                        "memory": "128Mi",
                        "cpu": "100m"
                      },
                      "limits": {
                        "memory": "512Mi"
                      }
                    },
                    "volumeMounts": [
                      {
                        "name": "trust",
                        "mountPath": "/etc/waba",
                        "readOnly": true
                      }
                    ]
                  }
                ],
                "volumes": [
                  {
                    "name": "trust",
                    "secret": {
                      "secretName": "waba-metadata-trust"
                    }
                  }
                ]
              }
            }
          }
        }
      }
    }
  ]
}
