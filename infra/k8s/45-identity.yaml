{
  "apiVersion": "v1",
  "kind": "List",
  "items": [
    {
      "apiVersion": "v1",
      "kind": "PersistentVolumeClaim",
      "metadata": {
        "name": "keycloak-state",
        "namespace": "governance",
        "labels": {
          "app.kubernetes.io/part-of": "waba"
        }
      },
      "spec": {
        "accessModes": [
          "ReadWriteOnce"
        ],
        "resources": {
          "requests": {
            "storage": "1Gi"
          }
        }
      }
    },
    {
      "apiVersion": "apps/v1",
      "kind": "Deployment",
      "metadata": {
        "name": "keycloak",
        "namespace": "governance",
        "labels": {
          "app.kubernetes.io/part-of": "waba"
        }
      },
      "spec": {
        "replicas": 0,
        "strategy": {
          "type": "Recreate"
        },
        "selector": {
          "matchLabels": {
            "app": "keycloak"
          }
        },
        "template": {
          "metadata": {
            "labels": {
              "app.kubernetes.io/part-of": "waba",
              "app": "keycloak"
            }
          },
          "spec": {
            "containers": [
              {
                "name": "keycloak",
                "image": "quay.io/keycloak/keycloak:26.4.0",
                "imagePullPolicy": "IfNotPresent",
                "ports": [
                  {
                    "containerPort": 8080
                  }
                ],
                "resources": {
                  "requests": {
                    "cpu": "100m",
                    "memory": "128Mi"
                  },
                  "limits": {
                    "memory": "1Gi"
                  }
                },
                "env": [
                  {
                    "name": "KC_HOSTNAME",
                    "value": "http://localhost:18080"
                  },
                  {
                    "name": "KC_HOSTNAME_BACKCHANNEL_DYNAMIC",
                    "value": "true"
                  },
                  {
                    "name": "KC_HEALTH_ENABLED",
                    "value": "true"
                  },
                  {
                    "name": "JAVA_OPTS_KC_HEAP",
                    "value": "-Xms128m -Xmx512m"
                  }
                ],
                "envFrom": [
                  {
                    "secretRef": {
                      "name": "waba-identity-runtime"
                    }
                  }
                ],
                "volumeMounts": [
                  {
                    "name": "state",
                    "mountPath": "/opt/keycloak/data"
                  },
                  {
                    "name": "realm",
                    "mountPath": "/opt/keycloak/data/import"
                  }
                ],
                "startupProbe": {
                  "httpGet": {
                    "path": "/health/ready",
                    "port": 9000
                  },
                  "periodSeconds": 10,
                  "failureThreshold": 30
                },
                "readinessProbe": {
                  "httpGet": {
                    "path": "/health/ready",
                    "port": 9000
                  },
                  "periodSeconds": 15,
                  "failureThreshold": 3
                },
                "livenessProbe": {
                  "httpGet": {
                    "path": "/health/ready",
                    "port": 9000
                  },
                  "periodSeconds": 30,
                  "failureThreshold": 5
                },
                "args": [
                  "start-dev",
                  "--import-realm"
                ]
              }
            ],
            "volumes": [
              {
                "name": "state",
                "persistentVolumeClaim": {
                  "claimName": "keycloak-state"
                }
              },
              {
                "name": "realm",
                "secret": {
                  "secretName": "waba-keycloak-import"
                }
              }
            ],
            "terminationGracePeriodSeconds": 45,
            "automountServiceAccountToken": false,
            "securityContext": {
              "fsGroup": 1000
            }
          }
        }
      }
    },
    {
      "apiVersion": "v1",
      "kind": "Service",
      "metadata": {
        "name": "keycloak",
        "namespace": "governance",
        "labels": {
          "app.kubernetes.io/part-of": "waba"
        }
      },
      "spec": {
        "selector": {
          "app": "keycloak"
        },
        "ports": [
          {
            "name": "p8080",
            "port": 8080,
            "targetPort": 8080
          }
        ]
      }
    }
  ]
}
