    {
      "apiVersion": "apps/v1",
      "kind": "Deployment",
      "metadata": {
        "name": "catalog",
        "namespace": "processing",
        "labels": {
          "app.kubernetes.io/part-of": "waba"
        }
      },
      "spec": {
        "replicas": 1,
        "strategy": {
          "type": "Recreate"
        },
        "selector": {
          "matchLabels": {
            "app": "catalog"
          }
        },
        "template": {
          "metadata": {
            "labels": {
              "app.kubernetes.io/part-of": "waba",
              "app": "catalog"
            }
          },
          "spec": {
            "containers": [
              {
                "name": "catalog",
                "image": "apache/iceberg-rest-fixture:1.9.1",
                "imagePullPolicy": "IfNotPresent",
                "ports": [
                  {
                    "containerPort": 8181
                  }
                ],
                "resources": {
                  "requests": {
                    "cpu": "100m",
                    "memory": "128Mi"
                  },
                  "limits": {
                    "memory": "768Mi"
                  }
                },
                "env": [
                  {
                    "name": "AWS_REGION",
                    "value": "us-east-1"
                  },
                  {
                    "name": "CATALOG_WAREHOUSE",
                    "value": "s3://lakehouse/"
                  },
                  {
                    "name": "CATALOG_IO__IMPL",
                    "value": "org.apache.iceberg.aws.s3.S3FileIO"
                  },
                  {
                    "name": "CATALOG_S3_ENDPOINT",
                    "value": "http://minio:9000"
                  },
                  {
                    "name": "CATALOG_S3_PATH__STYLE__ACCESS",
                    "value": "true"
                  },
                  {
                    "name": "CATALOG_URI",
                    "value": "jdbc:sqlite:/catalog/catalog.db"
                  },
                  {
                    "name": "JAVA_TOOL_OPTIONS",
                    "value": "-Xmx384m"
                  }
                ],
                "envFrom": [
                  {
                    "secretRef": {
                      "name": "waba-runtime"
                    }
                  }
                ],
                "volumeMounts": [
                  {
                    "name": "data",
                    "mountPath": "/catalog"
                  }
                ],
                "startupProbe": {
                  "httpGet": {
                    "path": "/v1/config",
                    "port": 8181
                  },
                  "periodSeconds": 10,
                  "failureThreshold": 30
                },
                "readinessProbe": {
                  "httpGet": {
                    "path": "/v1/config",
                    "port": 8181
                  },
                  "periodSeconds": 15,
                  "failureThreshold": 3
                },
                "livenessProbe": {
                  "httpGet": {
                    "path": "/v1/config",
                    "port": 8181
                  },
                  "periodSeconds": 30,
                  "failureThreshold": 5
                }
              }
            ],
            "volumes": [
              {
                "name": "data",
                "persistentVolumeClaim": {
                  "claimName": "catalog-data"
                }
              }
            ],
            "terminationGracePeriodSeconds": 45,
            "automountServiceAccountToken": false,
            "initContainers": [
              {
                "name": "catalog-owner",
                "image": "waba/spark:20261014",
                "command": [
                  "python3",
                  "-c",
                  "import os; os.chown('/catalog',1000,1000)"
                ],
                "securityContext": {
                  "runAsUser": 0
                },
                "volumeMounts": [
                  {
                    "name": "data",
                    "mountPath": "/catalog"
                  }
                ]
              }
            ]
          }
        }
      }
    },
