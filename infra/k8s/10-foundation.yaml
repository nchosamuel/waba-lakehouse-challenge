    {
      "apiVersion": "apps/v1",
      "kind": "Deployment",
      "metadata": {
        "name": "minio",
        "namespace": "ingestion",
        "labels": {
          "app.kubernetes.io/part-of": "waba"
        }
      },
      "spec": {
        "replicas": 1,
        "strategy": {
          "type": "Recreate"
        },
        "selector": {
          "matchLabels": {
            "app": "minio"
          }
        },
        "template": {
          "metadata": {
            "labels": {
              "app.kubernetes.io/part-of": "waba",
              "app": "minio"
            }
          },
          "spec": {
            "containers": [
              {
                "name": "minio",
                "image": "waba/minio:20261014",
                "imagePullPolicy": "IfNotPresent",
                "ports": [
                  {
                    "containerPort": 9000
                  }
                ],
                "resources": {
                  "requests": {
                    "cpu": "100m",
                    "memory": "128Mi"
                  },
                  "limits": {
                    "memory": "768Mi"
                  }
                },
                "env": [],
                "envFrom": [
                  {
                    "secretRef": {
                      "name": "waba-runtime"
                    }
                  }
                ],
                "volumeMounts": [
                  {
                    "name": "data",
                    "mountPath": "/data"
                  }
                ],
                "startupProbe": {
                  "httpGet": {
                    "path": "/minio/health/live",
                    "port": 9000
                  },
                  "periodSeconds": 10,
                  "failureThreshold": 30
                },
                "readinessProbe": {
                  "httpGet": {
                    "path": "/minio/health/live",
                    "port": 9000
                  },
                  "periodSeconds": 15,
                  "failureThreshold": 3
                },
                "livenessProbe": {
                  "httpGet": {
                    "path": "/minio/health/live",
                    "port": 9000
                  },
                  "periodSeconds": 30,
                  "failureThreshold": 5
                },
                "command": [
                  "minio"
                ],
                "args": [
                  "server",
                  "/data",
                  "--console-address",
                  ":9001"
                ]
              }
            ],
            "volumes": [
              {
                "name": "data",
                "persistentVolumeClaim": {
                  "claimName": "minio-data"
                }
              }
            ],
            "terminationGracePeriodSeconds": 45,
            "automountServiceAccountToken": false
          }
        }
      }
    },
    {
      "apiVersion": "v1",
      "kind": "Service",
      "metadata": {
