      "data": {
        "aml_events.json": "{\n  \"tableName\": \"aml_events\",\n  \"schemaName\": \"default\",\n  \"topicName\": \"gold-aml-events\",\n  \"message\": {\n    \"dataFormat\": \"json\",\n    \"fields\": [\n      {\n        \"name\": \"alert_id\",\n        \"type\": \"varchar\",\n        \"mapping\": \"alert_id\"\n      },\n      {\n        \"name\": \"country_code\",\n        \"type\": \"varchar\",\n        \"mapping\": \"country_code\"\n      },\n      {\n        \"name\": \"entity_type\",\n        \"type\": \"varchar\",\n        \"mapping\": \"entity_type\"\n      },\n      {\n        \"name\": \"rule\",\n        \"type\": \"varchar\",\n        \"mapping\": \"rule\"\n      },\n      {\n        \"name\": \"subject_id\",\n        \"type\": \"varchar\",\n        \"mapping\": \"subject_id\"\n      },\n      {\n        \"name\": \"event_count\",\n        \"type\": \"bigint\",\n        \"mapping\": \"event_count\"\n      },\n      {\n        \"name\": \"amount_eur\",\n        \"type\": \"double\",\n        \"mapping\": \"amount_eur\"\n      },\n      {\n        \"name\": \"detected_at\",\n        \"type\": \"varchar\",\n        \"mapping\": \"detected_at\"\n      }\n    ]\n  }\n}\n",
        "fraud_alerts.json": "{\n  \"tableName\": \"fraud_alerts\",\n  \"schemaName\": \"default\",\n  \"topicName\": \"gold-fraud-alerts\",\n  \"message\": {\n    \"dataFormat\": \"json\",\n    \"fields\": [\n      {\n        \"name\": \"alert_id\",\n        \"type\": \"varchar\",\n        \"mapping\": \"alert_id\"\n      },\n      {\n        \"name\": \"country_code\",\n        \"type\": \"varchar\",\n        \"mapping\": \"country_code\"\n      },\n      {\n        \"name\": \"entity_type\",\n        \"type\": \"varchar\",\n        \"mapping\": \"entity_type\"\n      },\n      {\n        \"name\": \"rule\",\n        \"type\": \"varchar\",\n        \"mapping\": \"rule\"\n      },\n      {\n        \"name\": \"subject_id\",\n        \"type\": \"varchar\",\n        \"mapping\": \"subject_id\"\n      },\n      {\n        \"name\": \"event_count\",\n        \"type\": \"bigint\",\n        \"mapping\": \"event_count\"\n      },\n      {\n        \"name\": \"amount_eur\",\n        \"type\": \"double\",\n        \"mapping\": \"amount_eur\"\n      },\n      {\n        \"name\": \"detected_at\",\n        \"type\": \"varchar\",\n        \"mapping\": \"detected_at\"\n      }\n    ]\n  }\n}\n",
        "silver_insurance_operations.json": "{\n  \"tableName\": \"silver_insurance_operations\",\n  \"schemaName\": \"default\",\n  \"topicName\": \"silver-insurance-operations\",\n  \"message\": {\n    \"dataFormat\": \"json\",\n    \"fields\": [\n      {\n        \"name\": \"event_id\",\n        \"type\": \"varchar\",\n        \"mapping\": \"operation_id\"\n      },\n      {\n        \"name\": \"country_code\",\n        \"type\": \"varchar\",\n        \"mapping\": \"country_code\"\n      },\n      {\n        \"name\": \"entity_type\",\n        \"type\": \"varchar\",\n        \"mapping\": \"entity_type\"\n      },\n      {\n        \"name\": \"event_time\",\n        \"type\": \"varchar\",\n        \"mapping\": \"timestamp\"\n      },\n      {\n        \"name\": \"amount_eur\",\n        \"type\": \"double\",\n        \"mapping\": \"amount_eur\"\n      }\n    ]\n  }\n}\n",
        "liquidity_alerts.json": "{\n  \"tableName\": \"liquidity_alerts\",\n  \"schemaName\": \"default\",\n  \"topicName\": \"gold-liquidity-alerts\",\n  \"message\": {\n    \"dataFormat\": \"json\",\n    \"fields\": [\n      {\n        \"name\": \"alert_id\",\n        \"type\": \"varchar\",\n        \"mapping\": \"alert_id\"\n      },\n      {\n        \"name\": \"country_code\",\n        \"type\": \"varchar\",\n        \"mapping\": \"country_code\"\n      },\n      {\n        \"name\": \"entity_type\",\n        \"type\": \"varchar\",\n        \"mapping\": \"entity_type\"\n      },\n      {\n        \"name\": \"rule\",\n        \"type\": \"varchar\",\n        \"mapping\": \"rule\"\n      },\n      {\n        \"name\": \"subject_id\",\n        \"type\": \"varchar\",\n        \"mapping\": \"subject_id\"\n      },\n      {\n        \"name\": \"event_count\",\n        \"type\": \"bigint\",\n        \"mapping\": \"event_count\"\n      },\n      {\n        \"name\": \"amount_eur\",\n        \"type\": \"double\",\n        \"mapping\": \"amount_eur\"\n      },\n      {\n        \"name\": \"detected_at\",\n        \"type\": \"varchar\",\n        \"mapping\": \"detected_at\"\n      }\n    ]\n  }\n}\n",
        "silver_bank_transactions.json": "{\n  \"tableName\": \"silver_bank_transactions\",\n  \"schemaName\": \"default\",\n  \"topicName\": \"silver-bank-transactions\",\n  \"message\": {\n    \"dataFormat\": \"json\",\n    \"fields\": [\n      {\n        \"name\": \"event_id\",\n        \"type\": \"varchar\",\n        \"mapping\": \"transaction_id\"\n      },\n      {\n        \"name\": \"country_code\",\n        \"type\": \"varchar\",\n        \"mapping\": \"country_code\"\n      },\n      {\n        \"name\": \"entity_type\",\n        \"type\": \"varchar\",\n        \"mapping\": \"entity_type\"\n      },\n      {\n        \"name\": \"event_time\",\n        \"type\": \"varchar\",\n        \"mapping\": \"timestamp\"\n      },\n      {\n        \"name\": \"txn_date\",\n        \"type\": \"varchar\",\n        \"mapping\": \"txn_date\"\n      },\n      {\n        \"name\": \"transaction_type\",\n        \"type\": \"varchar\",\n        \"mapping\": \"transaction_type\"\n      },\n      {\n        \"name\": \"transaction_status\",\n        \"type\": \"varchar\",\n        \"mapping\": \"transaction_status\"\n      },\n      {\n        \"name\": \"amount_eur\",\n        \"type\": \"double\",\n        \"mapping\": \"amount_eur\"\n      },\n      {\n        \"name\": \"account_id\",\n        \"type\": \"varchar\",\n        \"mapping\": \"account_id\"\n      }\n    ]\n  }\n}\n",
