{
  "apiVersion": "v1",
  "kind": "List",
  "items": [
    {
      "apiVersion": "v1",
      "kind": "PersistentVolumeClaim",
      "metadata": {
        "name": "airflow-state",
        "namespace": "processing",
        "labels": {
          "app.kubernetes.io/part-of": "waba"
        }
      },
      "spec": {
        "accessModes": [
          "ReadWriteOnce"
        ],
        "resources": {
          "requests": {
            "storage": "1Gi"
          }
        }
      }
    },
    {
      "apiVersion": "v1",
      "kind": "PersistentVolumeClaim",
      "metadata": {
        "name": "airflow-logs",
        "namespace": "processing",
        "labels": {
          "app.kubernetes.io/part-of": "waba"
        }
      },
      "spec": {
        "accessModes": [
          "ReadWriteOnce"
        ],
        "resources": {
          "requests": {
            "storage": "1Gi"
          }
        }
      }
    },
    {
      "apiVersion": "v1",
      "kind": "ServiceAccount",
      "metadata": {
        "name": "waba-runner",
        "namespace": "processing",
        "labels": {
          "app.kubernetes.io/part-of": "waba"
        }
      }
    },
    {
      "apiVersion": "rbac.authorization.k8s.io/v1",
      "kind": "Role",
      "metadata": {
        "name": "waba-runner",
        "namespace": "processing"
      },
      "rules": [
        {
          "apiGroups": [
            "sparkoperator.k8s.io"
          ],
          "resources": [
            "sparkapplications"
          ],
          "verbs": [
            "get",
            "list",
            "create"
          ]
        }
      ]
    },
    {
      "apiVersion": "rbac.authorization.k8s.io/v1",
      "kind": "RoleBinding",
      "metadata": {
        "name": "waba-runner",
        "namespace": "processing"
      },
      "subjects": [
        {
          "kind": "ServiceAccount",
          "name": "waba-runner",
          "namespace": "processing"
        }
      ],
      "roleRef": {
        "apiGroup": "rbac.authorization.k8s.io",
        "kind": "Role",
        "name": "waba-runner"
      }
    },
    {
      "apiVersion": "apps/v1",
      "kind": "Deployment",
      "metadata": {
        "name": "spark-runner",
        "namespace": "processing",
        "labels": {
          "app.kubernetes.io/part-of": "waba"
        }
      },
      "spec": {
        "replicas": 0,
        "strategy": {
          "type": "Recreate"
        },
        "selector": {
          "matchLabels": {
            "app": "spark-runner"
          }
        },
        "template": {
          "metadata": {
            "labels": {
              "app.kubernetes.io/part-of": "waba",
              "app": "spark-runner"
            }
          },
          "spec": {
            "containers": [
              {
                "name": "spark-runner",
                "image": "waba/spark:20261014",
                "imagePullPolicy": "IfNotPresent",
                "ports": [
                  {
                    "containerPort": 8090
                  }
                ],
                "resources": {
                  "requests": {
                    "cpu": "100m",
                    "memory": "128Mi"
                  },
                  "limits": {
                    "memory": "256Mi"
                  }
                },
                "env": [],
                "envFrom": [
                  {
                    "secretRef": {
                      "name": "waba-runtime"
                    }
                  }
                ],
                "volumeMounts": [],
                "startupProbe": {
                  "httpGet": {
                    "path": "/health",
                    "port": 8090
                  },
                  "periodSeconds": 10,
                  "failureThreshold": 30
                },
                "readinessProbe": {
                  "httpGet": {
                    "path": "/health",
                    "port": 8090
                  },
                  "periodSeconds": 15,
                  "failureThreshold": 3
                },
                "livenessProbe": {
                  "httpGet": {
                    "path": "/health",
                    "port": 8090
                  },
                  "periodSeconds": 30,
                  "failureThreshold": 5
                },
                "command": [
                  "python3",
                  "/app/jobs/kubernetes_runner.py"
                ]
              }
            ],
            "volumes": [],
            "terminationGracePeriodSeconds": 45,
            "automountServiceAccountToken": true,
            "serviceAccountName": "waba-runner"
          }
        }
      }
    },
    {
      "apiVersion": "v1",
      "kind": "Service",
      "metadata": {
        "name": "spark-runner",
        "namespace": "processing",
        "labels": {
          "app.kubernetes.io/part-of": "waba"
        }
      },
      "spec": {
        "selector": {
          "app": "spark-runner"
        },
        "ports": [
          {
            "name": "p8090",
            "port": 8090,
            "targetPort": 8090
          }
        ]
      }
    },
    {
      "apiVersion": "apps/v1",
      "kind": "Deployment",
      "metadata": {
        "name": "airflow",
        "namespace": "processing",
        "labels": {
          "app.kubernetes.io/part-of": "waba"
        }
      },
      "spec": {
        "replicas": 0,
        "strategy": {
          "type": "Recreate"
        },
        "selector": {
          "matchLabels": {
            "app": "airflow"
          }
        },
        "template": {
          "metadata": {
            "labels": {
              "app.kubernetes.io/part-of": "waba",
              "app": "airflow"
            }
          },
          "spec": {
            "containers": [
              {
                "name": "airflow",
                "image": "waba/airflow:20261014",
                "imagePullPolicy": "IfNotPresent",
                "ports": [
                  {
                    "containerPort": 8081
                  }
                ],
                "resources": {
                  "requests": {
                    "cpu": "100m",
                    "memory": "128Mi"
                  },
                  "limits": {
                    "memory": "1536Mi"
                  }
                },
                "env": [
                  {
                    "name": "AIRFLOW__CORE__EXECUTOR",
                    "value": "SequentialExecutor"
                  },
                  {
                    "name": "AIRFLOW__CORE__LOAD_EXAMPLES",
                    "value": "false"
                  },
                  {
                    "name": "AIRFLOW__CORE__PARALLELISM",
                    "value": "1"
                  },
                  {
                    "name": "AIRFLOW__SCHEDULER__PARSING_PROCESSES",
                    "value": "1"
                  },
                  {
                    "name": "AIRFLOW__CORE__DEFAULT_TIMEZONE",
                    "value": "utc"
                  },
                  {
                    "name": "AIRFLOW__DATABASE__SQL_ALCHEMY_CONN",
                    "value": "sqlite:////opt/airflow/state/airflow.db"
                  },
                  {
                    "name": "AIRFLOW__WEBSERVER__WORKERS",
                    "value": "1"
                  },
                  {
                    "name": "AIRFLOW__WEBSERVER__EXPOSE_CONFIG",
                    "value": "false"
                  },
                  {
                    "name": "AIRFLOW__API__AUTH_BACKENDS",
                    "value": "airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session"
                  },
                  {
                    "name": "AIRFLOW_VAR_WABA_SPARK_RUNNER_URL",
                    "value": "http://spark-runner:8090"
                  },
                  {
                    "name": "PYTHONPATH",
                    "value": "/app/src"
                  }
                ],
                "envFrom": [
                  {
                    "secretRef": {
                      "name": "waba-runtime"
                    }
                  }
                ],
                "volumeMounts": [
                  {
                    "name": "state",
                    "mountPath": "/opt/airflow/state"
                  },
                  {
                    "name": "logs",
                    "mountPath": "/opt/airflow/logs"
                  }
                ],
                "startupProbe": {
                  "httpGet": {
                    "path": "/health",
                    "port": 8081
                  },
                  "periodSeconds": 10,
                  "failureThreshold": 30
                },
                "readinessProbe": {
                  "httpGet": {
                    "path": "/health",
                    "port": 8081
                  },
                  "periodSeconds": 15,
                  "failureThreshold": 3
                },
                "livenessProbe": {
                  "httpGet": {
                    "path": "/health",
                    "port": 8081
                  },
                  "periodSeconds": 30,
                  "failureThreshold": 5
                }
              }
            ],
            "volumes": [
              {
                "name": "state",
                "persistentVolumeClaim": {
                  "claimName": "airflow-state"
                }
              },
              {
                "name": "logs",
                "persistentVolumeClaim": {
                  "claimName": "airflow-logs"
                }
              }
            ],
            "terminationGracePeriodSeconds": 45,
            "automountServiceAccountToken": false
          }
        }
      }
    },
    {
      "apiVersion": "v1",
      "kind": "Service",
      "metadata": {
        "name": "airflow",
        "namespace": "processing",
        "labels": {
          "app.kubernetes.io/part-of": "waba"
        }
      },
      "spec": {
        "selector": {
          "app": "airflow"
        },
        "ports": [
          {
            "name": "p8081",
            "port": 8081,
            "targetPort": 8081
          }
        ]
      }
    }
  ]
}
