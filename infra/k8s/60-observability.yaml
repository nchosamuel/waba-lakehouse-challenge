        }
      },
      "data": {
        "loki.json": "{\n  \"auth_enabled\": false,\n  \"server\": {\n    \"http_listen_port\": 3100\n  },\n  \"common\": {\n    \"path_prefix\": \"/loki\",\n    \"replication_factor\": 1,\n    \"ring\": {\n      \"kvstore\": {\n        \"store\": \"inmemory\"\n      }\n    },\n    \"storage\": {\n      \"filesystem\": {\n        \"chunks_directory\": \"/loki/chunks\",\n        \"rules_directory\": \"/loki/rules\"\n      }\n    }\n  },\n  \"schema_config\": {\n    \"configs\": [\n      {\n        \"from\": \"2025-01-01\",\n        \"store\": \"tsdb\",\n        \"object_store\": \"filesystem\",\n        \"schema\": \"v13\",\n        \"index\": {\n          \"prefix\": \"index_\",\n          \"period\": \"24h\"\n        }\n      }\n    ]\n  },\n  \"limits_config\": {\n    \"retention_period\": \"72h\",\n    \"reject_old_samples\": false\n  },\n  \"compactor\": {\n    \"working_directory\": \"/loki/compactor\",\n    \"retention_enabled\": true,\n    \"delete_request_store\": \"filesystem\"\n  },\n  \"analytics\": {\n    \"reporting_enabled\": false\n  }\n}\n",
        "providers.json": "{\n  \"apiVersion\": 1,\n  \"providers\": [\n    {\n      \"name\": \"WABA\",\n      \"folder\": \"WABA\",\n      \"type\": \"file\",\n      \"options\": {\n        \"path\": \"/var/lib/grafana/dashboards\"\n      },\n      \"allowUiUpdates\": false\n    }\n  ]\n}\n",
        "prometheus.json": "{\n  \"global\": {\n    \"scrape_interval\": \"15s\",\n    \"evaluation_interval\": \"15s\"\n  },\n  \"scrape_configs\": [\n    {\n      \"job_name\": \"prometheus\",\n      \"static_configs\": [\n        {\n          \"targets\": [\n            \"localhost:9090\"\n          ]\n        }\n      ]\n    },\n    {\n      \"job_name\": \"waba\",\n      \"static_configs\": [\n        {\n          \"targets\": [\n            \"observability-exporter.processing:9108\"\n          ]\n        }\n      ]\n    },\n    {\n      \"job_name\": \"loki\",\n      \"static_configs\": [\n        {\n          \"targets\": [\n            \"loki.monitoring:3100\"\n          ]\n        }\n      ]\n    },\n    {\n      \"job_name\": \"alloy\",\n      \"static_configs\": [\n        {\n          \"targets\": [\n            \"alloy.processing:12345\"\n          ]\n        }\n      ]\n    },\n    {\n      \"job_name\": \"spark-native\",\n      \"kubernetes_sd_configs\": [\n        {\n          \"role\": \"pod\",\n          \"namespaces\": {\n            \"names\": [\n              \"processing\"\n            ]\n          }\n        }\n      ],\n      \"metrics_path\": \"/metrics/executors/prometheus\",\n      \"relabel_configs\": [\n        {\n          \"source_labels\": [\n            \"__meta_kubernetes_pod_label_spark_role\"\n          ],\n          \"regex\": \"driver\",\n          \"action\": \"keep\"\n        },\n        {\n          \"source_labels\": [\n            \"__meta_kubernetes_pod_phase\"\n          ],\n          \"regex\": \"Running\",\n          \"action\": \"keep\"\n        },\n        {\n          \"source_labels\": [\n            \"__meta_kubernetes_pod_ip\"\n          ],\n          \"target_label\": \"__address__\",\n          \"replacement\": \"${1}:4040\"\n        },\n        {\n          \"source_labels\": [\n            \"__meta_kubernetes_pod_name\"\n          ],\n          \"target_label\": \"application\"\n        }\n      ]\n    }\n  ]\n}\n",
        "dashboard.json": "{\n  \"uid\": \"waba-health\",\n  \"title\": \"WABA \\u2014 Sant\\u00e9 des pipelines\",\n  \"schemaVersion\": 41,\n  \"version\": 1,\n  \"refresh\": \"15s\",\n  \"timezone\": \"utc\",\n  \"time\": {\n    \"from\": \"now-1h\",\n    \"to\": \"now\"\n  },\n  \"tags\": [\n    \"WABA\",\n    \"local\",\n    \"observability\"\n  ],\n  \"panels\": [\n    {\n      \"id\": 1,\n      \"title\": \"Services actifs \\u2014 r\\u00e9plicas pr\\u00eats\",\n      \"description\": \"Comparer avec les r\\u00e9plicas demand\\u00e9s : 0 demand\\u00e9 signifie un arr\\u00eat volontaire.\",\n      \"type\": \"timeseries\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"waba-prometheus\"\n      },\n      \"gridPos\": {\n        \"x\": 0,\n        \"y\": 0,\n        \"w\": 12,\n        \"h\": 8\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"short\"\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"legend\": {\n          \"displayMode\": \"table\",\n          \"placement\": \"bottom\"\n        }\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"expr\": \"waba_component_ready_replicas\",\n          \"legendFormat\": \"{{component}}{{source}}{{exported_job}} {{country_scope}}{{query}}{{dag}}{{scenario}}\",\n          \"instant\": false,\n          \"format\": \"time_series\"\n        }\n      ]\n    },\n    {\n      \"id\": 2,\n      \"title\": \"Services demand\\u00e9s \\u2014 0 = pause volontaire\",\n      \"description\": \"\",\n      \"type\": \"timeseries\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"waba-prometheus\"\n      },\n      \"gridPos\": {\n        \"x\": 12,\n        \"y\": 0,\n        \"w\": 12,\n        \"h\": 8\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"short\"\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"legend\": {\n          \"displayMode\": \"table\",\n          \"placement\": \"bottom\"\n        }\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"expr\": \"waba_component_desired_replicas\",\n          \"legendFormat\": \"{{component}}{{source}}{{exported_job}} {{country_scope}}{{query}}{{dag}}{{scenario}}\",\n          \"instant\": false,\n          \"format\": \"time_series\"\n        }\n      ]\n    },\n    {\n      \"id\": 3,\n      \"title\": \"Disponibilit\\u00e9 des collecteurs\",\n      \"description\": \"0 signifie mesure indisponible ; aucune valeur r\\u00e9elle remplac\\u00e9e par z\\u00e9ro.\",\n      \"type\": \"stat\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"waba-prometheus\"\n      },\n      \"gridPos\": {\n        \"x\": 0,\n        \"y\": 8,\n        \"w\": 12,\n        \"h\": 8\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"short\",\n          \"color\": {\n            \"mode\": \"thresholds\"\n          },\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              {\n                \"color\": \"red\",\n                \"value\": null\n              },\n              {\n                \"color\": \"green\",\n                \"value\": 1\n              }\n            ]\n          }\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"legend\": {\n          \"displayMode\": \"table\",\n          \"placement\": \"bottom\"\n        }\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"expr\": \"waba_telemetry_available\",\n          \"legendFormat\": \"{{component}}{{source}}{{exported_job}} {{country_scope}}{{query}}{{dag}}{{scenario}}\",\n          \"instant\": true,\n          \"format\": \"time_series\"\n        }\n      ]\n    },\n    {\n      \"id\": 4,\n      \"title\": \"Dur\\u00e9e des jobs Spark par p\\u00e9rim\\u00e8tre pays\",\n      \"description\": \"Dur\\u00e9e du job entier. CI indique un traitement CI ; ALL indique un traitement partag\\u00e9, pas une mesure ind\\u00e9pendante par pays.\",\n      \"type\": \"table\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"waba-prometheus\"\n      },\n      \"gridPos\": {\n        \"x\": 12,\n        \"y\": 8,\n        \"w\": 12,\n        \"h\": 8\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"s\"\n        },\n        \"overrides\": [\n          {\n            \"matcher\": {\n              \"id\": \"byName\",\n              \"options\": \"Pays / p\\u00e9rim\\u00e8tre\"\n            },\n            \"properties\": [\n              {\n                \"id\": \"custom.width\",\n                \"value\": 120\n              }\n            ]\n          },\n          {\n            \"matcher\": {\n              \"id\": \"byName\",\n              \"options\": \"Traitement\"\n            },\n            \"properties\": [\n              {\n                \"id\": \"custom.width\",\n                \"value\": 170\n              }\n            ]\n          },\n          {\n            \"matcher\": {\n              \"id\": \"byName\",\n              \"options\": \"\\u00c9tat\"\n            },\n            \"properties\": [\n              {\n                \"id\": \"custom.width\",\n                \"value\": 110\n              }\n            ]\n          },\n          {\n            \"matcher\": {\n              \"id\": \"byName\",\n              \"options\": \"Dur\\u00e9e\"\n            },\n            \"properties\": [\n              {\n                \"id\": \"custom.width\",\n                \"value\": 90\n              }\n            ]\n          },\n          {\n            \"matcher\": {\n              \"id\": \"byName\",\n              \"options\": \"Application\"\n            },\n            \"properties\": [\n              {\n                \"id\": \"custom.w