          },\n              \"datasourceUid\": \"waba-prometheus\",\n              \"model\": {\n                \"refId\": \"A\",\n                \"expr\": \"time() - waba_exporter_collection_timestamp_seconds\",\n                \"instant\": true,\n                \"intervalMs\": 15000,\n                \"maxDataPoints\": 43200\n              }\n            },\n            {\n              \"refId\": \"B\",\n              \"relativeTimeRange\": {\n                \"from\": 0,\n                \"to\": 0\n              },\n              \"datasourceUid\": \"__expr__\",\n              \"model\": {\n                \"refId\": \"B\",\n                \"type\": \"threshold\",\n                \"expression\": \"A\",\n                \"conditions\": [\n                  {\n                    \"type\": \"query\",\n                    \"evaluator\": {\n                      \"type\": \"gt\",\n                      \"params\": [\n                        120\n                      ]\n                    },\n                    \"operator\": {\n                      \"type\": \"and\"\n                    },\n                    \"reducer\": {\n                      \"type\": \"last\",\n                      \"params\": []\n                    }\n                  }\n                ]\n              }\n            }\n          ]\n        },\n        {\n          \"uid\": \"waba-exporter-absent\",\n          \"title\": \"Exporteur absent\",\n          \"condition\": \"B\",\n          \"for\": \"1m\",\n          \"noDataState\": \"NoData\",\n          \"execErrState\": \"Error\",\n          \"isPaused\": false,\n          \"annotations\": {\n            \"summary\": \"La s\\u00e9rie de fra\\u00eecheur de l\\u2019exporteur a disparu.\"\n          },\n          \"labels\": {\n            \"team\": \"waba\",\n            \"severity\": \"warning\",\n            \"scenario\": \"live\"\n          },\n          \"data\": [\n            {\n              \"refId\": \"A\",\n              \"relativeTimeRange\": {\n                \"from\": 600,\n                \"to\": 0\n              },\n              \"datasourceUid\": \"waba-prometheus\",\n              \"model\": {\n                \"refId\": \"A\",\n                \"expr\": \"absent(waba_exporter_collection_timestamp_seconds) or vector(0)\",\n                \"instant\": true,\n                \"intervalMs\": 15000,\n                \"maxDataPoints\": 43200\n              }\n            },\n            {\n              \"refId\": \"B\",\n              \"relativeTimeRange\": {\n                \"from\": 0,\n                \"to\": 0\n              },\n              \"datasourceUid\": \"__expr__\",\n              \"model\": {\n                \"refId\": \"B\",\n                \"type\": \"threshold\",\n                \"expression\": \"A\",\n                \"conditions\": [\n                  {\n                    \"type\": \"query\",\n                    \"evaluator\": {\n                      \"type\": \"gt\",\n                      \"params\": [\n                        0\n                      ]\n                    },\n                    \"operator\": {\n                      \"type\": \"and\"\n                    },\n                    \"reducer\": {\n                      \"type\": \"last\",\n                      \"params\": []\n                    }\n                  }\n                ]\n              }\n            }\n          ]\n        }\n      ]\n    }\n  ],\n  \"contactPoints\": [\n    {\n      \"orgId\": 1,\n      \"name\": \"waba-local\",\n      \"receivers\": [\n        {\n          \"uid\": \"waba-local-webhook\",\n          \"type\": \"webhook\",\n          \"settings\": {\n            \"url\": \"http://observability-exporter.processing:9108/alerts\",\n            \"httpMethod\": \"POST\"\n          },\n          \"disableResolveMessage\": false\n        }\n      ]\n    }\n  ],\n  \"policies\": [\n    {\n      \"orgId\": 1,\n      \"receiver\": \"waba-local\",\n      \"group_by\": [\n        \"alertname\",\n        \"scenario\"\n      ],\n      \"group_wait\": \"5s\",\n      \"group_interval\": \"10s\",\n      \"repeat_interval\": \"1h\"\n    }\n  ]\n}\n",
        "datasources.json": "{\n  \"apiVersion\": 1,\n  \"datasources\": [\n    {\n      \"name\": \"Prometheus\",\n      \"uid\": \"waba-prometheus\",\n      \"type\": \"prometheus\",\n      \"url\": \"http://prometheus.monitoring:9090\",\n      \"access\": \"proxy\",\n      \"isDefault\": true,\n      \"editable\": false\n    },\n    {\n      \"name\": \"Loki\",\n      \"uid\": \"waba-loki\",\n      \"type\": \"loki\",\n      \"url\": \"http://loki.monitoring:3100\",\n      \"access\": \"proxy\",\n      \"editable\": false\n    }\n  ]\n}\n",
        "config.alloy": "discovery.kubernetes \"pods\" {\n  role = \"pod\"\n  namespaces { names = [\"ingestion\", \"processing\", \"serving\", \"governance\", \"monitoring\"] }\n}\ndiscovery.relabel \"logs\" {\n  targets = discovery.kubernetes.pods.targets\n  rule { source_labels = [\"__meta_kubernetes_namespace\"]\n    target_label = \"namespace\" }\n  rule { source_labels = [\"__meta_kubernetes_pod_name\"]\n    target_label = \"pod\" }\n  rule { source_labels = [\"__meta_kubernetes_pod_container_name\"]\n    target_label = \"container\" }\n}\nloki.source.kubernetes \"pods\" {\n  targets = discovery.relabel.logs.output\n  forward_to = [loki.process.json.receiver]\n}\nlocal.file_match \"airflow\" {\n  path_targets = [{\"__path__\" = \"/airflow-logs/dag_id=*/run_id=*/task_id=*/*.log\", \"namespace\" = \"processing\", \"component\" = \"airflow-task\"}]\n}\nloki.source.file \"airflow\" {\n  targets = local.file_match.airflow.targets\n  forward_to = [loki.process.json.receiver]\n}\nloki.process \"json\" {\n  stage.json { expressions = {\"event\" = \"event\", \"job\" = \"job\", \"country_code\" = \"country_code\", \"level\" = \"level\"} }\n  stage.labels { values = {\"event\" = \"\", \"job\" = \"\", \"country_code\" = \"\", \"level\" = \"\"} }\n  forward_to = [loki.write.local.receiver]\n}\nloki.write \"local\" {\n  endpoint { url = \"http://loki.monitoring:3100/loki/api/v1/push\" }\n}\n"
