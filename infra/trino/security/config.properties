coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
http-server.authentication.type=OAUTH2
http-server.authentication.allow-insecure-over-http=false
http-server.https.enabled=true
http-server.https.port=8443
http-server.https.keystore.path=/etc/trino/tls/server.p12
http-server.https.keystore.key=${ENV:TRINO_TLS_PASSWORD}
internal-communication.shared-secret=${ENV:TRINO_INTERNAL_SECRET}
discovery.uri=http://localhost:8080
query.max-memory=512MB
query.max-memory-per-node=512MB
memory.heap-headroom-per-node=256MB
web-ui.authentication.type=OAUTH2
http-server.authentication.oauth2.issuer=http://localhost:18080/realms/waba
http-server.authentication.oauth2.client-id=waba-trino
http-server.authentication.oauth2.client-secret=${ENV:KEYCLOAK_TRINO_SECRET}
http-server.authentication.oauth2.oidc.discovery=false
http-server.authentication.oauth2.auth-url=http://localhost:18080/realms/waba/protocol/openid-connect/auth
http-server.authentication.oauth2.token-url=http://keycloak.governance:8080/realms/waba/protocol/openid-connect/token
http-server.authentication.oauth2.jwks-url=http://keycloak.governance:8080/realms/waba/protocol/openid-connect/certs
http-server.authentication.oauth2.end-session-url=http://localhost:18080/realms/waba/protocol/openid-connect/logout
http-server.authentication.oauth2.principal-field=preferred_username
deprecated.http-server.authentication.oauth2.groups-field=waba_trino_roles
