name: Unit tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: pip install boto3==1.37.38
      - name: Pure and mocked tests (Docker integration checks run locally)
        env:
          PYTHONPATH: src
        run: python scripts/test_unit.py
      - run: python -m compileall -q src app jobs dags scripts
